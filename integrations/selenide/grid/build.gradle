description = "Selenide Selenium Grid integration for remote WebDriver execution"

ext {
    artifactId = "selenide-grid"
}

dependencies {
    implementation project(":integrations:selenide:selenide")

    implementation "com.codeborne:selenide-grid:${selenide}"
    testImplementation "io.qameta.allure:allure-testng:${allure}"

    api "org.assertj:assertj-core"
}
