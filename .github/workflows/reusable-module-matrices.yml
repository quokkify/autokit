name: Reusable module matrices

on:
  workflow_call:
    outputs:
      common_modules:
        description: Common modules matrix include list
        value: ${{ jobs.emit.outputs.common_modules }}
      data_build_modules:
        description: Data modules for build matrix include list
        value: ${{ jobs.emit.outputs.data_build_modules }}
      integrations_build_modules:
        description: Integrations modules for build matrix include list
        value: ${{ jobs.emit.outputs.integrations_build_modules }}
      data_test_modules:
        description: Data modules for test matrix include list
        value: ${{ jobs.emit.outputs.data_test_modules }}
      integrations_test_modules:
        description: Integrations modules for test matrix include list
        value: ${{ jobs.emit.outputs.integrations_test_modules }}

permissions:
  contents: read

jobs:
  emit:
    name: Emit module matrices
    runs-on: ubuntu-latest
    outputs:
      common_modules: ${{ steps.emit.outputs.common_modules }}
      data_build_modules: ${{ steps.emit.outputs.data_build_modules }}
      integrations_build_modules: ${{ steps.emit.outputs.integrations_build_modules }}
      data_test_modules: ${{ steps.emit.outputs.data_test_modules }}
      integrations_test_modules: ${{ steps.emit.outputs.integrations_test_modules }}
    steps:
      - name: Emit JSON outputs
        id: emit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commonModules = [
              { name: 'testng-extensions', module: ':testng-extensions', slug: 'testng-extensions' },
              { name: 'core', module: ':common-utils:core', slug: 'common-utils-core' },
              { name: 'jackson • parent', module: ':common-utils:jackson:parent', slug: 'common-utils-jackson-parent' },
              { name: 'jackson • csv', module: ':common-utils:jackson:csv', slug: 'common-utils-jackson-csv' },
              { name: 'jackson • xml', module: ':common-utils:jackson:xml', slug: 'common-utils-jackson-xml' },
              { name: 'jackson • json', module: ':common-utils:jackson:json', slug: 'common-utils-jackson-json' },
              { name: 'jackson • yaml', module: ':common-utils:jackson:yaml', slug: 'common-utils-jackson-yaml' },
              { name: 'introspection', module: ':common-utils:introspection', slug: 'common-utils-introspection' },
              { name: 'awaitility', module: ':common-utils:awaitility', slug: 'common-utils-awaitility' },
              { name: 'file', module: ':common-utils:file', slug: 'common-utils-file' },
              { name: 'html', module: ':common-utils:html', slug: 'common-utils-html' },
              { name: 'jwt', module: ':common-utils:jwt', slug: 'common-utils-jwt' },
              { name: 'config', module: ':common-utils:config', slug: 'common-utils-config' },
              { name: 'signature', module: ':common-utils:signature', slug: 'common-utils-signature' },
              { name: 'console', module: ':common-utils:console', slug: 'common-utils-console' },
            ];

            const dataBuildModules = [
              { name: 'sql', module: ':data-utils:sql', slug: 'data-utils-sql' },
              { name: 'nosql • parent', module: ':data-utils:nosql', slug: 'data-utils-nosql' },
              { name: 'nosql • morphia', module: ':data-utils:nosql:morphia', slug: 'data-utils-nosql-morphia' },
              { name: 'nosql • redis', module: ':data-utils:nosql:redis', slug: 'data-utils-nosql-redis' },
            ];

            const integrationsBuildModules = [
              { name: 'rest-assured', module: ':integrations:rest-assured', slug: 'integrations-rest-assured' },
              { name: 'selenide', module: ':integrations:selenide', slug: 'integrations-selenide' },
              { name: 'tyrus', module: ':integrations:tyrus', slug: 'integrations-tyrus' },
              { name: 'kafka', module: ':integrations:kafka', slug: 'integrations-kafka' },
              { name: 'rabbitmq', module: ':integrations:rabbitmq', slug: 'integrations-rabbitmq' },
              { name: 'jira • core', module: ':integrations:jira:jira-core', slug: 'integrations-jira-core' },
              { name: 'jira • testng', module: ':integrations:jira:testng', slug: 'integrations-jira-testng' },
              { name: 'jira • testrail', module: ':integrations:jira:testrail', slug: 'integrations-jira-testrail' },
              { name: 'testrail • core', module: ':integrations:testrail:testrail-core', slug: 'integrations-testrail-core' },
              { name: 'testrail • testng', module: ':integrations:testrail:testng', slug: 'integrations-testrail-testng' },
              { name: 'reportportal • core', module: ':integrations:reportportal:reportportal-core', slug: 'integrations-reportportal-core' },
              { name: 'reportportal • testng', module: ':integrations:reportportal:testng', slug: 'integrations-reportportal-testng' },
            ];

            const dataTestModules = [
              { name: 'sql', module: ':data-utils:sql', slug: 'data-utils-sql', profile: 'none' },
              { name: 'nosql • parent', module: ':data-utils:nosql', slug: 'data-utils-nosql', profile: 'none' },
              { name: 'nosql • morphia', module: ':data-utils:nosql:morphia', slug: 'data-utils-nosql-morphia', profile: 'storage' },
              { name: 'nosql • redis', module: ':data-utils:nosql:redis', slug: 'data-utils-nosql-redis', profile: 'redis' },
            ];

            const integrationsTestModules = [
              { name: 'rest-assured', module: ':integrations:rest-assured', slug: 'integrations-rest-assured', profile: 'mock' },
              { name: 'selenide', module: ':integrations:selenide', slug: 'integrations-selenide', profile: 'web' },
              { name: 'tyrus', module: ':integrations:tyrus', slug: 'integrations-tyrus', profile: 'none' },
              { name: 'kafka', module: ':integrations:kafka', slug: 'integrations-kafka', profile: 'messaging' },
              { name: 'rabbitmq', module: ':integrations:rabbitmq', slug: 'integrations-rabbitmq', profile: 'rabbitmq' },
              { name: 'jira • core', module: ':integrations:jira:jira-core', slug: 'integrations-jira-core', profile: 'none' },
              { name: 'jira • testng', module: ':integrations:jira:testng', slug: 'integrations-jira-testng', profile: 'none' },
              { name: 'jira • testrail', module: ':integrations:jira:testrail', slug: 'integrations-jira-testrail', profile: 'none' },
              { name: 'testrail • core', module: ':integrations:testrail:testrail-core', slug: 'integrations-testrail-core', profile: 'none' },
              { name: 'testrail • testng', module: ':integrations:testrail:testng', slug: 'integrations-testrail-testng', profile: 'none' },
              { name: 'reportportal • core', module: ':integrations:reportportal:reportportal-core', slug: 'integrations-reportportal-core', profile: 'none' },
              { name: 'reportportal • testng', module: ':integrations:reportportal:testng', slug: 'integrations-reportportal-testng', profile: 'reporting' },
            ];

            core.setOutput('common_modules', JSON.stringify(commonModules));
            core.setOutput('data_build_modules', JSON.stringify(dataBuildModules));
            core.setOutput('integrations_build_modules', JSON.stringify(integrationsBuildModules));
            core.setOutput('data_test_modules', JSON.stringify(dataTestModules));
            core.setOutput('integrations_test_modules', JSON.stringify(integrationsTestModules));
