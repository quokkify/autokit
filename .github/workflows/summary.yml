name: "Test Report"
on:
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      is_self_hosted: ${{ steps.select.outputs.is_self_hosted }}
    steps:
      - name: Choose runner
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RUNNER_DISCOVERY_TOKEN || github.token }}
          script: |
            const labels = ['self-hosted', 'compose', 'internal'];
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const eventName = context.eventName;
            let allowSelfHosted = false;

            if (eventName === 'workflow_run') {
              const run = context.payload.workflow_run || {};
              const runEvent = run.event || 'unknown';
              if (runEvent === 'push') {
                allowSelfHosted = true;
              } else if (runEvent === 'pull_request') {
                const headRepo = run.head_repository?.full_name;
                const baseRepo = run.repository?.full_name;
                const sameRepo = headRepo && baseRepo ? headRepo === baseRepo : false;
                const association = run.actor?.association || 'NONE';
                const actorLogin = (run.actor?.login || '').toLowerCase();
                const isRenovateBot = actorLogin === 'renovate[bot]';
                allowSelfHosted = sameRepo && (trusted.has(association) || isRenovateBot);
              }
            }

            if (!allowSelfHosted) {
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
              return;
            }

            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const hasLabels = (runner) =>
                labels.every((label) =>
                  runner.labels.some((item) => item.name.toLowerCase() === label)
                );
              const online = data.runners.find(
                (runner) => runner.status === 'online' && hasLabels(runner)
              );
              const runsOn = online ? labels : ['ubuntu-latest'];
              core.setOutput('runs_on', JSON.stringify(runsOn));
              core.setOutput('is_self_hosted', String(Boolean(online)));
            } catch (error) {
              core.warning(`Runner discovery failed, falling back to github-hosted: ${error}`);
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
            }

  report:
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 📦 Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: 🧩 Merge JUnit XML (junitparser)
        shell: bash
        run: |
          ./tools/scripts/ci/merge_junit_reports.sh artifacts artifacts/_combined/combined-junit.xml

      - name: 🔬Combined test report
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2
        with:
          name: "🔬Combined test report"
          path: "artifacts/_combined/combined-junit.xml"
          reporter: java-junit
