name: "Test Report"
on:
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: workflow_run_pr_trusted
      same_repo: ${{ github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name }}
      trusted_author: ${{ contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.workflow_run.actor.association) }}
      is_renovate_bot: ${{ github.event.workflow_run.actor.login == 'renovate[bot]' }}
    secrets: inherit
    if: ${{ github.event.workflow_run.event == 'pull_request' }}

  report:
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 📦 Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: 🔍 Detect JUnit XML files
        id: junit
        shell: bash
        run: |
          count=$(find artifacts -type f -path "*/build/test-results/*/TEST-*.xml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            echo "No JUnit XML files found. Skipping report generation."
          fi

      - name: 🧩 Merge JUnit XML (junitparser)
        if: ${{ steps.junit.outputs.count != '0' }}
        shell: bash
        run: |
          ./tools/scripts/ci/merge_junit_reports.sh artifacts artifacts/_combined/combined-junit.xml

      - name: 🔬Combined test report
        if: ${{ steps.junit.outputs.count != '0' }}
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2
        with:
          name: "🔬Combined test report"
          path: "artifacts/_combined/combined-junit.xml"
          reporter: java-junit
