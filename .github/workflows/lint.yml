name: "Run prettier"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      is_self_hosted: ${{ steps.select.outputs.is_self_hosted }}
    steps:
      - name: Choose runner
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RUNNER_DISCOVERY_TOKEN || github.token }}
          script: |
            const labels = ['self-hosted', 'compose', 'internal'];
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const eventName = context.eventName;
            let allowSelfHosted = false;

            if (eventName === 'push') {
              allowSelfHosted = true;
            } else if (eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const sameRepo = pr?.head?.repo?.full_name && pr?.base?.repo?.full_name
                ? pr.head.repo.full_name === pr.base.repo.full_name
                : false;
              const association = pr?.author_association || 'NONE';
              const authorLogin = (pr?.user?.login || '').toLowerCase();
              const isRenovateBot = authorLogin === 'renovate[bot]';
              allowSelfHosted = sameRepo && (trusted.has(association) || isRenovateBot);
            }

            if (!allowSelfHosted) {
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
              return;
            }

            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const hasLabels = (runner) =>
                labels.every((label) =>
                  runner.labels.some((item) => item.name.toLowerCase() === label)
                );
              const online = data.runners.find(
                (runner) => runner.status === 'online' && hasLabels(runner)
              );
              const runsOn = online ? labels : ['ubuntu-latest'];
              core.setOutput('runs_on', JSON.stringify(runsOn));
              core.setOutput('is_self_hosted', String(Boolean(online)));
            } catch (error) {
              core.warning(`Runner discovery failed, falling back to github-hosted: ${error}`);
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
            }

  check-formatting:
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    steps:
      - name: 🔨Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: 🔧 Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
      - name: 🔬Check repository through Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check .
