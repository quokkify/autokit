name: "Run prettier"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      is_self_hosted: ${{ steps.select.outputs.is_self_hosted }}
    steps:
      - name: Choose runner
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['self-hosted', 'linux', 'compose', 'internal'];
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const hasLabels = (runner) =>
                labels.every((label) => runner.labels.some((item) => item.name === label));
              const online = data.runners.find(
                (runner) => runner.status === 'online' && hasLabels(runner)
              );
              const runsOn = online ? labels : ['ubuntu-latest'];
              core.setOutput('runs_on', JSON.stringify(runsOn));
              core.setOutput('is_self_hosted', String(Boolean(online)));
            } catch (error) {
              core.warning(`Runner discovery failed, falling back to github-hosted: ${error}`);
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
            }

  check-formatting:
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci-approval' || 'ci' }}
    permissions:
      contents: read
    steps:
      - name: 🔨Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: 🔬Check repository over Prettier
        uses: actionsx/prettier@3d9f7c3fa44c9cb819e68292a328d7f4384be206 # v3
        with:
          args: --check --ignore-unknown '**/*.*'
