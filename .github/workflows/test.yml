name: "Run tests"
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: pr_trusted
      same_repo: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      trusted_author: ${{ contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
      is_renovate_bot: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    secrets: inherit

  module-matrices:
    uses: ./.github/workflows/reusable-module-matrices.yml

  check-formatting:
    name: Lint (Prettier)
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔧 Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24"

      - name: 🔬Check repository through Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check .

  build-common:
    name: "Build common • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, check-formatting]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.common_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  build-data:
    name: "Build data • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.data_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  build-integrations:
    name: "Build integrations • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.integrations_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  test-common:
    name: "Common • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.common_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🚀 Run tests
        run: ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-report-common-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  test-data:
    name: "Data • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-data, test-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.data_test_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🟢 Start Infra
        if: ${{ matrix.profile != 'none' }}
        run: ./tools/environment/scripts/infra/run_app.sh "${{ matrix.profile }}"
        shell: bash

      - name: 🔎 Debug Infra Connectivity
        if: ${{ matrix.profile == 'websockets' || matrix.profile == 'rabbitmq' }}
        run: |
          set -x
          source ./tools/environment/scripts/infra/load_bootstrap_env.sh

          compose_cmd() {
            docker compose \
              -f tools/environment/docker/docker-compose.yml \
              -f tools/environment/docker/docker-compose.ci.yml \
              "$@"
          }

          echo "CI=${CI:-} EXECUTION_MODE=${EXECUTION_MODE:-} COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-}"

          if [[ "${{ matrix.profile }}" == "websockets" ]]; then
            echo "CENTRIFUGO_HOST=${CENTRIFUGO_HOST:-} CENTRIFUGO_PORT=${CENTRIFUGO_PORT:-}"
            cat tools/environment/.websockets.env || true

            compose_cmd --profile websockets ps || true
            compose_cmd --profile websockets port centrifugo 8000 || true
            compose_cmd --profile websockets logs --tail=200 centrifugo || true

            for host in "${CENTRIFUGO_HOST:-}" localhost 127.0.0.1 dind; do
              [[ -z "$host" ]] && continue
              echo "probe ${host}:${CENTRIFUGO_PORT:-}"
              (echo >/dev/tcp/"$host"/"${CENTRIFUGO_PORT:-0}") >/dev/null 2>&1 && echo "TCP OK" || echo "TCP FAIL"
            done
          fi

          if [[ "${{ matrix.profile }}" == "rabbitmq" ]]; then
            echo "RABBIT_HOST=${RABBIT_HOST:-} RABBIT_PORT=${RABBIT_PORT:-}"
            cat tools/environment/.rabbitmq.env || true

            compose_cmd --profile rabbitmq ps || true
            compose_cmd --profile rabbitmq port rabbitmq 5672 || true
            compose_cmd --profile rabbitmq logs --tail=200 rabbitmq || true

            for host in "${RABBIT_HOST:-}" localhost 127.0.0.1 dind; do
              [[ -z "$host" ]] && continue
              echo "probe ${host}:${RABBIT_PORT:-}"
              (echo >/dev/tcp/"$host"/"${RABBIT_PORT:-0}") >/dev/null 2>&1 && echo "TCP OK" || echo "TCP FAIL"
            done
          fi
        shell: bash

      - name: 🚀 Run tests
        run: |
          source ./tools/environment/scripts/infra/load_bootstrap_env.sh
          if [[ -n "${KAFKA_BOOTSTRAP_SERVERS:-}" ]]; then
            export KAFKA_SERVER_ADDRESS="${KAFKA_BOOTSTRAP_SERVERS}"
          fi
          if [[ "${{ matrix.profile }}" == "web" ]]; then
            if [[ -n "${NGINX_BASE_URL:-}" ]]; then
              export BASE_URL="${NGINX_BASE_URL}"
            else
              echo "NGINX_BASE_URL is not set for web profile" >&2
              exit 1
            fi
          fi

          ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🛑 Stop Infra
        if: ${{ matrix.profile != 'none' && always() }}
        run: ./tools/environment/scripts/infra/stop_app.sh
        shell: bash

      - name: 📦 Pack docker compose logs as artifact
        if: ${{ matrix.profile != 'none' && always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-logs-data-${{ matrix.slug }}
          retention-days: 3
          path: logs

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-report-data-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  test-integrations:
    name: "Integrations • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-integrations, test-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.integrations_test_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔨Prepare Java/Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          is_self_hosted: ${{ needs.detect-runner.outputs.is_self_hosted }}

      - name: 🟢 Start Infra
        if: ${{ matrix.profile != 'none' }}
        run: ./tools/environment/scripts/infra/run_app.sh "${{ matrix.profile }}"
        shell: bash

      - name: 🔎 Debug Infra Connectivity
        if: ${{ matrix.profile == 'websockets' || matrix.profile == 'rabbitmq' }}
        run: |
          set -x
          source ./tools/environment/scripts/infra/load_bootstrap_env.sh

          compose_cmd() {
            docker compose \
              -f tools/environment/docker/docker-compose.yml \
              -f tools/environment/docker/docker-compose.ci.yml \
              "$@"
          }

          echo "CI=${CI:-} EXECUTION_MODE=${EXECUTION_MODE:-} COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-}"

          if [[ "${{ matrix.profile }}" == "websockets" ]]; then
            echo "CENTRIFUGO_HOST=${CENTRIFUGO_HOST:-} CENTRIFUGO_PORT=${CENTRIFUGO_PORT:-}"
            cat tools/environment/.websockets.env || true

            compose_cmd --profile websockets ps || true
            compose_cmd --profile websockets port centrifugo 8000 || true
            compose_cmd --profile websockets logs --tail=200 centrifugo || true

            for host in "${CENTRIFUGO_HOST:-}" localhost 127.0.0.1 dind; do
              [[ -z "$host" ]] && continue
              echo "probe ${host}:${CENTRIFUGO_PORT:-}"
              (echo >/dev/tcp/"$host"/"${CENTRIFUGO_PORT:-0}") >/dev/null 2>&1 && echo "TCP OK" || echo "TCP FAIL"
            done
          fi

          if [[ "${{ matrix.profile }}" == "rabbitmq" ]]; then
            echo "RABBIT_HOST=${RABBIT_HOST:-} RABBIT_PORT=${RABBIT_PORT:-}"
            cat tools/environment/.rabbitmq.env || true

            compose_cmd --profile rabbitmq ps || true
            compose_cmd --profile rabbitmq port rabbitmq 5672 || true
            compose_cmd --profile rabbitmq logs --tail=200 rabbitmq || true

            for host in "${RABBIT_HOST:-}" localhost 127.0.0.1 dind; do
              [[ -z "$host" ]] && continue
              echo "probe ${host}:${RABBIT_PORT:-}"
              (echo >/dev/tcp/"$host"/"${RABBIT_PORT:-0}") >/dev/null 2>&1 && echo "TCP OK" || echo "TCP FAIL"
            done
          fi
        shell: bash

      - name: 🚀 Run tests
        run: |
          source ./tools/environment/scripts/infra/load_bootstrap_env.sh
          if [[ -n "${KAFKA_BOOTSTRAP_SERVERS:-}" ]]; then
            export KAFKA_SERVER_ADDRESS="${KAFKA_BOOTSTRAP_SERVERS}"
          fi
          if [[ "${{ matrix.profile }}" == "web" ]]; then
            if [[ -n "${NGINX_BASE_URL:-}" ]]; then
              export BASE_URL="${NGINX_BASE_URL}"
            else
              echo "NGINX_BASE_URL is not set for web profile" >&2
              exit 1
            fi
          fi

          ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🛑 Stop Infra
        if: ${{ matrix.profile != 'none' && always() }}
        run: ./tools/environment/scripts/infra/stop_app.sh
        shell: bash

      - name: 📦 Pack docker compose logs as artifact
        if: ${{ matrix.profile != 'none' && always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-logs-integrations-${{ matrix.slug }}
          retention-days: 3
          path: logs

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-report-integrations-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  tests-complete:
    name: Tests pipeline complete
    needs: [test-data, test-integrations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate stage results
        shell: bash
        run: |
          if [[ "${{ needs.test-data.result }}" != "success" || "${{ needs.test-integrations.result }}" != "success" ]]; then
            echo "Test stages are not successful."
            exit 1
          fi
          echo "All test stages completed successfully."
