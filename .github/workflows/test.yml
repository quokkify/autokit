name: "Run tests"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-tests-on-linux:
    name: "Linux • ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "testng-extensions"
            module: ":testng-extensions"
            slug: "testng-extensions"
            profile: "none"

          - name: "integrations • rest-assured"
            module: ":integrations:rest-assured"
            slug: "integrations-rest-assured"
            profile: "mock"

          - name: "data-utils • sql"
            module: ":data-utils:sql"
            slug: "data-utils-sql"
            profile: "none"

          - name: "common-utils • core"
            module: ":common-utils:core"
            slug: "common-utils-core"
            profile: "none"

          - name: "common-utils • jackson • parent"
            module: ":common-utils:jackson:parent"
            slug: "common-utils-jackson-parent"
            profile: "none"

          - name: "common-utils • jackson • csv"
            module: ":common-utils:jackson:csv"
            slug: "common-utils-jackson-csv"
            profile: "none"

          - name: "common-utils • jackson • xml"
            module: ":common-utils:jackson:xml"
            slug: "common-utils-jackson-xml"
            profile: "none"

          - name: "common-utils • jackson • json"
            module: ":common-utils:jackson:json"
            slug: "common-utils-jackson-json"
            profile: "none"

          - name: "common-utils • jackson • yaml"
            module: ":common-utils:jackson:yaml"
            slug: "common-utils-jackson-yaml"
            profile: "none"

          - name: "common-utils • introspection"
            module: ":common-utils:introspection"
            slug: "common-utils-introspection"
            profile: "none"

          - name: "common-utils • awaitility"
            module: ":common-utils:awaitility"
            slug: "common-utils-awaitility"
            profile: "none"

          - name: "common-utils • file"
            module: ":common-utils:file"
            slug: "common-utils-file"
            profile: "none"

          - name: "common-utils • html"
            module: ":common-utils:html"
            slug: "common-utils-html"
            profile: "none"

          - name: "common-utils • http"
            module: ":common-utils:http"
            slug: "common-utils-http"
            profile: "none"

          - name: "common-utils • jwt"
            module: ":common-utils:jwt"
            slug: "common-utils-jwt"
            profile: "none"

          - name: "common-utils • config"
            module: ":common-utils:config"
            slug: "common-utils-config"
            profile: "none"

          - name: "common-utils • signature"
            module: ":common-utils:signature"
            slug: "common-utils-signature"
            profile: "none"

          - name: "common-utils • console"
            module: ":common-utils:console"
            slug: "common-utils-console"
            profile: "none"

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: 🔨Set up JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: "25"

      - name: 🔨Build with Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5

      - name: 🟢 Start Infra
        if: ${{ matrix.profile != 'none' }}
        run: ./tools/scripts/infra/run_app.sh "${{ matrix.infra_profile }}"
        shell: bash

      - name: 🚀 Run tests
        run: ./gradlew ${{ matrix.module }}:check --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🐳 Collecting logs from all docker containers
        if: ${{ matrix.needs_app && always() }}
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2
        with:
          dest: logs

      - name: 🛑Stop Application
        if: ${{ matrix.needs_app && always() }}
        run: ./tools/scripts/dev/stop_app.sh
        shell: bash

      - name: 📦 Packing docker compose logs as artifact
        if: ${{ matrix.needs_app && always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-logs-${{ matrix.slug }}
          retention-days: 3
          path: logs

      - name: 📦Packing test results as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-report-linux-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results
