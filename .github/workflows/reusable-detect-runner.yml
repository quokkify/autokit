name: Reusable runner detection

on:
  workflow_call:
    inputs:
      strategy:
        description: One of pr_trusted, push_any, workflow_run_pr_trusted
        required: true
        type: string
      same_repo:
        description: Whether source and target repositories are the same (for PR-like events)
        required: false
        type: boolean
        default: false
      trusted_author:
        description: Whether PR/workflow actor is trusted (OWNER, MEMBER, COLLABORATOR)
        required: false
        type: boolean
        default: false
      is_renovate_bot:
        description: Whether actor is renovate[bot]
        required: false
        type: boolean
        default: false
    outputs:
      runs_on:
        description: Runner labels as JSON array
        value: ${{ jobs.detect-runner.outputs.runs_on }}
      is_self_hosted:
        description: Whether self-hosted runner is selected
        value: ${{ jobs.detect-runner.outputs.is_self_hosted }}

permissions:
  contents: read
  actions: none

jobs:
  detect-runner:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      is_self_hosted: ${{ steps.select.outputs.is_self_hosted }}
    steps:
      - name: Choose runner
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RUNNER_DISCOVERY_TOKEN || github.token }}
          script: |
            const labels = ['self-hosted', 'compose', 'internal'];
            const strategy = '${{ inputs.strategy }}';

            const setHosted = () => {
              core.setOutput('runs_on', JSON.stringify(['ubuntu-latest']));
              core.setOutput('is_self_hosted', 'false');
            };
            const setSelfHosted = () => {
              core.setOutput('runs_on', JSON.stringify(labels));
              core.setOutput('is_self_hosted', 'true');
            };

            let allowSelfHosted = false;

            if (strategy === 'push_any') {
              allowSelfHosted = true;
            } else if (strategy === 'pr_trusted') {
              allowSelfHosted =
                ${{ inputs.same_repo }} &&
                (${{ inputs.trusted_author }} || ${{ inputs.is_renovate_bot }});
            } else if (strategy === 'workflow_run_pr_trusted') {
              const runEvent = context.payload.workflow_run?.event || 'unknown';
              if (runEvent === 'pull_request') {
                allowSelfHosted =
                  ${{ inputs.same_repo }} &&
                  (${{ inputs.trusted_author }} || ${{ inputs.is_renovate_bot }});
              }
            } else {
              core.warning(`Unknown strategy '${strategy}', using github-hosted runner.`);
            }

            if (!allowSelfHosted) {
              setHosted();
              return;
            }

            setSelfHosted();
