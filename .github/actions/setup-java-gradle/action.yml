name: Setup Java and Gradle

description: Setup Java 21 and Gradle with cache strategy based on runner type.

inputs:
  is_self_hosted:
    description: Whether selected runner is self-hosted.
    required: true

author: quokkify

runs:
  using: composite
  steps:
    - name: 🔨Set up JDK (self-hosted, no actions cache)
      if: ${{ inputs.is_self_hosted == 'true' }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: "21"

    - name: 🔨Set up JDK (github-hosted, cache gradle)
      if: ${{ inputs.is_self_hosted != 'true' }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        cache: gradle
        java-version: "21"

    - name: 🔨Build with Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
