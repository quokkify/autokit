services:
  nginx:
    profiles: [web]
    image: nginx:1.29.5@sha256:341bf0f3ce6c5277d6002cf6e1fb0319fa4252add24ab6a0e262e0056d313208
    ports:
      - "80:80"

  selenium-hub:
    profiles: [web]
    image: selenium/hub:4.40.0-20260120@sha256:e49e85c3a481f3c63292436266bb56a72036dc977ab0fd5a9ec7fbd78c5636fa
    environment:
      SE_SUB_PATH: /wd/hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  selenium-node-docker:
    profiles: [web]
    image: selenium/node-docker:4.40.0-20260120@sha256:adf92f879b1024086d7ce0070c3a8a48324cd97c1e1278bdf150cfc692192f55
    depends_on:
      - selenium-hub
      - docker-socket-proxy
    volumes:
      - ${SELENIUM_GRID_MOUNT:-../selenium-grid}:/opt/selenium/config.d:ro
      - ../selenium-grid/assets:/opt/selenium/assets
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_DOCKER_CONFIG_FILENAME: config.d/config.toml
      SE_OPTS: --enable-managed-downloads true --enable-cdp false

  docker-socket-proxy:
    profiles: [web]
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka:
    profiles: [messaging]
    image: wurstmeister/kafka:2.13-2.8.1@sha256:2d4bbf9cc83d9854d36582987da5f939fb9255fb128d18e3cf2c6ad825a32751
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_PORT: 9092
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: EXTERNAL_SAME_HOST://:29092,INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_SAME_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_CREATE_TOPICS: >
        messages:1:1
    ports:
      - "29092:29092"
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    profiles: [messaging]
    image: zookeeper:3.9@sha256:f0f1d5e4a2763041ce1f7fc25e2b5347a2a0dfb0eaf0f46a49fe2e01945f9f09
    ports:
      - "2181:2181"

  mock-server:
    profiles: [mock]
    image: mockserver/mockserver:5.15.0@sha256:0f9ef78c94894ac3e70135d156193b25e23872575d58e2228344964273b4af6b
    command: -logLevel DEBUG -serverPort 1080
    environment:
      MOCKSERVER_WATCH_INITIALIZATION_JSON: true
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectation.json
    volumes:
      - ./mock/expectation.json:/config/expectation.json
    ports:
      - "1080:1080"

  centrifugo:
    profiles: [realtime]
    image: centrifugo/centrifugo:v6.5.2@sha256:055d950b56b85d0ab9dc402cb461bf481360e6b4967e32e2e840268047852fb3
    command: centrifugo -c centrifugo_new_config.json
    volumes:
      - ./centrifugo/centrifugo_new_config.json:/centrifugo/centrifugo_new_config.json
    ports:
      - "8005:8000"
    environment:
      CENTRIFUGO_PORT: 8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  mongodb:
    profiles: [storage]
    image: mongo:8.2.4@sha256:6f55a078e025aa29fea2826c82f67ff2f774b82efd816c4c30bbfe67904f0bb8
    restart: always
    ports:
      - "27017:27017"

  redis:
    profiles: [redis]
    image: redis:7.4.1
    ports:
      - "6379:6379"
