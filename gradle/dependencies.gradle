ext {
    aeonbits = "1.0.12"
    assertj = "3.27.7"
    jetbrains_annotations = "26.0.2-1"
    hamcrest = "3.0"
    testng = "7.12.0"
    faker = "2.5.4"
    selenide = "7.16.0"
    aeonbits = "1.0.12"
    log4j = "2.25.4"
    slf4j = "2.0.17"
    allure = "2.32.0"
    httpcore5 = "5.4"
    feign = "13.8"
    restAssured = "5.5.1"
    awaitility = "4.3.0"
    spotbugs_annotations = "4.9.8"
    bouncy_castle = "1.83"
    snakeyaml = "2.2"
    gson = "2.13.0"
    htmlcleaner = "2.29"
    guava = "33.5.0-jre"
    googleauth = "1.5.0"
    json = "20250107"
    jira_rest_client_core = "7.0.1"
    fugue = "6.1.2"
    opencsv = "5.10"
    commons_io = "2.22.0"
    jcabi_ssh = "1.9.0"
    modelmapper = "3.2.6"
    aspectj = "1.9.24"
    reflections = "0.10.2"
    fasterxml_jackson = "2.21.0"
    jakarta_xml = "4.0.2"
    jakarta_activation = "2.1.3"
    jaxb = "4.0.5"
    guice = "7.0.0"
    jjwt = "0.13.0"
    rest_assured = "6.0.0"
    jjschema = "1.16"
    report_portal_rest_assured = "5.3.4"
    report_portal_client_java = "5.2.15"
    hibernate = "7.2.4.Final"
    hibernate_type = "3.15.2"
    jakarta_persistence_api = "3.2.0"
    querydsl = "5.1.0"
    jedis = "5.2.0"
    redisson = "4.2.0"
    morphia = "2.5.2"
    mongodb_driver = "5.7.0"
    reportportal = "5.4.3"
    java_websocket = "1.6.0"
    kafka = "4.0.0"
    rabbitmq = "5.28.0"
    h2 = "2.4.240"
    classgraph = "4.8.184"
}

subprojects {
    repositories {
        mavenCentral()
        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            mavenContent {
                snapshotsOnly()
            }
        }
        maven {
            url = "https://packages.atlassian.com/maven/repository/public"
            name = "atlassian-public"
        }
    }

    dependencies {
        constraints {
            api "com.fasterxml.jackson:jackson-bom:${fasterxml_jackson}"
            api "org.aeonbits.owner:owner:${aeonbits}"
            api "org.slf4j:slf4j-api:${slf4j}"
            api "org.slf4j:jcl-over-slf4j:${slf4j}"
            api "org.apache.logging.log4j:log4j-api:${log4j}"
            api "org.apache.logging.log4j:log4j-core:${log4j}"
            api "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j}"
            api "org.assertj:assertj-core:${assertj}"
            api "org.hamcrest:hamcrest:${hamcrest}"
            api "org.awaitility:awaitility:${awaitility}"
            api "org.testng:testng:${testng}"
            api "io.qameta.allure:allure-testng:${allure}"
            api "commons-io:commons-io:${commons_io}"
            api "org.apache.commons:commons-lang3:3.20.0"
            api "org.apache.commons:commons-text:1.15.0"
        }

        compileOnly "org.jetbrains:annotations:${jetbrains_annotations}"
        annotationProcessor "org.jetbrains:annotations:${jetbrains_annotations}"
        testCompileOnly "org.jetbrains:annotations:${jetbrains_annotations}"
        testAnnotationProcessor "org.jetbrains:annotations:${jetbrains_annotations}"

        if (project.path != ":testng-extensions") {
            testImplementation project(":testng-extensions")
        }
        testImplementation "org.assertj:assertj-core"
        testImplementation "org.apache.logging.log4j:log4j-core"
        testImplementation "org.apache.logging.log4j:log4j-slf4j2-impl"

        compileOnly "com.github.spotbugs:spotbugs-annotations:${spotbugs_annotations}"
        testCompileOnly "com.github.spotbugs:spotbugs-annotations:${spotbugs_annotations}"
    }
}
